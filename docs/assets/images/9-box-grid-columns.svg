<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Georgia, serif">
  <!-- Column background washes -->
  <rect x="20" y="20" width="220" height="340" rx="8" fill="#e8f0fe" opacity="0.4"/>
  <rect x="250" y="20" width="220" height="340" rx="8" fill="#fef3e8" opacity="0.4"/>
  <rect x="480" y="20" width="220" height="340" rx="8" fill="#fde8e8" opacity="0.4"/>

  <!-- Row 1: Applied -->
  <rect x="30" y="30" width="200" height="90" rx="10" fill="#dbe9f9" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="130" y="65" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a3d6e">In Wonder</text>
  <text x="130" y="88" text-anchor="middle" font-size="13" fill="#1a3d6e" opacity="0.7">the conversation</text>

  <rect x="260" y="30" width="200" height="90" rx="10" fill="#fef3e8" stroke="#b06a1a" stroke-width="1.5"/>
  <text x="360" y="65" text-anchor="middle" font-size="17" font-weight="bold" fill="#6e3d1a">Real Life</text>
  <text x="360" y="88" text-anchor="middle" font-size="13" fill="#6e3d1a" opacity="0.7">the practice</text>

  <rect x="490" y="30" width="200" height="90" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="590" y="65" text-anchor="middle" font-size="17" font-weight="bold" fill="#6e1a1a">Engineering</text>
  <text x="590" y="88" text-anchor="middle" font-size="13" fill="#6e1a1a" opacity="0.7">the technology</text>

  <!-- Row 2: Framework -->
  <rect x="30" y="140" width="200" height="90" rx="10" fill="#dbe9f9" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="130" y="175" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a3d6e">Positioning</text>
  <text x="130" y="198" text-anchor="middle" font-size="13" fill="#1a3d6e" opacity="0.7">the landscape</text>

  <rect x="260" y="140" width="200" height="90" rx="10" fill="#fef3e8" stroke="#b06a1a" stroke-width="2.5"/>
  <text x="360" y="175" text-anchor="middle" font-size="17" font-weight="bold" fill="#6e3d1a">The Seed</text>
  <text x="360" y="198" text-anchor="middle" font-size="13" fill="#6e3d1a" opacity="0.7">the foundation</text>

  <rect x="490" y="140" width="200" height="90" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="590" y="175" text-anchor="middle" font-size="17" font-weight="bold" fill="#6e1a1a">Reality</text>
  <text x="590" y="198" text-anchor="middle" font-size="13" fill="#6e1a1a" opacity="0.7">the building</text>

  <!-- Row 3: Machinery -->
  <rect x="30" y="250" width="200" height="90" rx="10" fill="#dbe9f9" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="130" y="285" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a3d6e">Language</text>
  <text x="130" y="308" text-anchor="middle" font-size="13" fill="#1a3d6e" opacity="0.7">the relational</text>

  <rect x="260" y="250" width="200" height="90" rx="10" fill="#fef3e8" stroke="#b06a1a" stroke-width="1.5"/>
  <text x="360" y="285" text-anchor="middle" font-size="17" font-weight="bold" fill="#6e3d1a">Vocabulary</text>
  <text x="360" y="308" text-anchor="middle" font-size="13" fill="#6e3d1a" opacity="0.7">the conceptual</text>

  <rect x="490" y="250" width="200" height="90" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="590" y="285" text-anchor="middle" font-size="17" font-weight="bold" fill="#6e1a1a">Tools</text>
  <text x="590" y="308" text-anchor="middle" font-size="13" fill="#6e1a1a" opacity="0.7">the instrumental</text>

  <!-- Column labels -->
  <text x="130" y="370" text-anchor="middle" font-size="11" fill="#1a73e8" font-style="italic">engaging / relational</text>
  <text x="360" y="370" text-anchor="middle" font-size="11" fill="#b06a1a" font-style="italic">what-is / substantive</text>
  <text x="590" y="370" text-anchor="middle" font-size="11" fill="#c0392b" font-style="italic">constructed / instrumental</text>
</svg>