---
layout: default
---

<div class="home">
  {{ content }}

  <h2 class="post-list-heading">In Wonder - Blog Posts</h2>
  <ul class="post-list">
    {%- for post in site.posts -%}
    <li>
      <h3>
        <a class="post-link" href="{{ post.url | relative_url }}">
          {{ post.title | escape }}
        </a>
      </h3>
    </li>
    {%- endfor -%}
  </ul>
</div>
