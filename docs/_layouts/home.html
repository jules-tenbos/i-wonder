---
layout: default
---

<div class="home">
  {{ content }}

  <h2 class="post-list-heading"><a href="/blog/">In Wonder - The Conversation</a></h2>
  <div class="post-list-cols">
    <ul class="post-list">
      {%- for post in site.posts limit: 12 -%}
      <li>
        <h3>
          <a class="post-link" href="{{ post.url | relative_url }}">
            {{ post.title | escape }}
          </a>
        </h3>
      </li>
      {%- endfor -%}
    </ul>
  </div>
</div>
