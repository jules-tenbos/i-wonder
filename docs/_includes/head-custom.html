<link rel="icon" type="image/jpeg" href="/splectrum-icon.jpg">
<style>
  .project-name {
    display: none;
  }
  .site-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .site-header img {
    height: 32px;
    width: auto;
  }
  .site-header .site-title-full {
    font-size: 1.2em;
    font-weight: bold;
  }
  .site-header .site-title-short {
    font-size: 1.2em;
    font-weight: bold;
    display: none;
  }
  @media (max-width: 600px) {
    .site-header .site-title-full {
      display: none;
    }
    .site-header .site-title-short {
      display: inline;
    }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var header = document.querySelector('.project-name');
    if (header) {
      var parent = header.parentElement;
      var siteHeader = document.createElement('div');
      siteHeader.className = 'site-header';
      siteHeader.innerHTML = '<a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">' +
        '<img src="/splectrum-icon.jpg" alt="Splectrum">' +
        '<span class="site-title-full">The World of Splectrum</span>' +
        '<span class="site-title-short">Splectrum</span>' +
        '</a>';
      parent.insertBefore(siteHeader, header);
    }
  });
</script>
