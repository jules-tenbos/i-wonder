# Audio library transcription & processing configuration

audio_dir: /mnt/c/Herman/audio

whisper:
  model: base          # base (fast/CPU), small, medium (quality)
  language: en
  device: cpu

# Categories and their directory structure types
# flat:      category/series/files           (podcasts)
# subject:   category/subcategory/series/files  (lectures)
# author:    category/subcategory/author/book/files (readings)
categories:
  lectures:
    structure: subject
  podcasts:
    structure: flat
  readings:
    structure: author
  plays:
    structure: flat
  languages:
    structure: flat
  other:
    structure: flat

# Scope filtering — exclude non-research content
exclude:
  categories: [plays, languages, other]
  readings_subjects: [comedy, drama]

# Anthropic API settings for extraction
anthropic:
  model: claude-haiku-4-5-20251001

# Output settings for process.py
library_dir: library/catalog

# Logging
log_dir: library/pipeline/logs
