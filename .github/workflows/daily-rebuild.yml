name: Daily rebuild

# Triggers a Pages rebuild every day at 10:00 UTC — the publish time used
# in posting-guide.md. This ensures scheduled future-dated posts go live
# on their date, and that pending ref lib links (via pending-link.html)
# are re-evaluated against the current build time.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Push empty commit to trigger Pages rebuild
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit --allow-empty -m "Scheduled rebuild ($(date -u +'%Y-%m-%d'))"
          git push
